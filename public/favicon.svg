<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo cuadrado redondeado oscuro (mismo tono que la app) -->
  <rect width="64" height="64" rx="14" fill="#0b0e14"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#232a3a" stroke-width="1"/>

  <!-- Dot rojo "EN VIVO" arriba a la derecha con pulso -->
  <circle cx="52" cy="12" r="3.5" fill="#ef4444"/>
  <circle cx="52" cy="12" r="3.5" fill="#ef4444" opacity="0.35">
    <animate attributeName="r" values="3.5;7;3.5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0;0.35" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- "27" grande y bold en rojo (igual al wordmark del sidebar) -->
  <text
    x="32" y="46"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="34"
    font-weight="900"
    text-anchor="middle"
    fill="#ef4444"
    letter-spacing="-1.5"
  >27</text>
</svg>
